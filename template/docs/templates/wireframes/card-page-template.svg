<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- CARD PAGE WIREFRAME TEMPLATE. Copy to docs/wireframes/NN-<page-name>.svg and replace {{...}}.
       Set height on the svg and the background rect to fit the content. Row pitch is 32 px. -->
  <!-- Background -->
  <rect width="1060" height="420" fill="#fff"/>

  <!-- ============ BC HEADER BAR ============ -->
  <rect width="1060" height="40" fill="#1a3050"/>
  <text x="44" y="26" fill="#fff" font-size="14" font-weight="600">Dynamics 365 Business Central</text>
  <text x="780" y="26" fill="#6fa0c2" font-size="11">Environment: dev</text>
  <circle cx="940" cy="20" r="14" fill="#0078d4" opacity="0.9"/>
  <text x="933" y="24" fill="#fff" font-size="10" font-weight="700">PA</text>
  <text x="975" y="27" fill="#7d8c9c" font-size="17">⚙</text>
  <text x="1008" y="27" fill="#7d8c9c" font-size="17">?</text>

  <!-- ============ COMPANY BAR ============ -->
  <rect y="40" width="1060" height="36" fill="#fff"/>
  <line x1="0" y1="76" x2="1060" y2="76" stroke="#e1dfdd"/>
  <text x="20" y="64" fill="#323130" font-size="14" font-weight="700">CRONUS USA, Inc.</text>
  <text x="168" y="64" fill="#c8c6c4" font-size="14">|</text>
  <text x="186" y="64" fill="#0078d4" font-size="13">Finance ▾</text>
  <text x="256" y="64" fill="#0078d4" font-size="13">Cash Management ▾</text>
  <text x="400" y="64" fill="#0078d4" font-size="13">Sales ▾</text>
  <text x="450" y="64" fill="#0078d4" font-size="13">Purchasing ▾</text>

  <!-- ============ PAGE TITLE &amp; ACTION BAR ============ -->
  <rect y="76" width="1060" height="36" fill="#faf9f8"/>
  <line x1="0" y1="112" x2="1060" y2="112" stroke="#edebe9"/>
  <text x="20" y="100" fill="#323130" font-size="15" font-weight="600">{{Page Caption}} {{REC-0001}}</text>
  <line x1="280" y1="82" x2="280" y2="108" stroke="#e1dfdd"/>
  <text x="296" y="100" fill="#323130" font-size="13">Home ▾</text>
  <text x="358" y="100" fill="#323130" font-size="13" font-weight="600">{{Primary Action}}</text>
  <text x="480" y="100" fill="#323130" font-size="13">Actions ▾</text>
  <text x="555" y="100" fill="#323130" font-size="13">Navigate ▾</text>

  <!-- ============ FASTTAB: GENERAL ============ -->
  <rect x="0" y="116" width="1060" height="28" fill="#f3f2f1"/>
  <line x1="0" y1="144" x2="1060" y2="144" stroke="#edebe9"/>
  <text x="20" y="135" fill="#323130" font-size="13" font-weight="600">▾  General</text>

  <!-- Row 1 left: lookup field (blue value) | right: status pill -->
  <text x="30" y="172" fill="#605e5c" font-size="12">{{Lookup Field}}</text>
  <rect x="190" y="157" width="180" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="198" y="173" fill="#0078d4" font-size="12.5">{{10000}}</text>

  <text x="530" y="172" fill="#605e5c" font-size="12">Status</text>
  <rect x="654" y="158" width="90" height="20" rx="10" fill="#107c10" opacity="0.12"/>
  <text x="699" y="172" fill="#107c10" font-size="12" font-weight="600" text-anchor="middle">{{Active}}</text>

  <!-- Row 2 left: text field (read-only, no box) | right: dropdown -->
  <text x="30" y="204" fill="#605e5c" font-size="12">{{Read-only Field}}</text>
  <text x="198" y="205" fill="#323130" font-size="12.5">{{Value}}</text>

  <text x="530" y="204" fill="#605e5c" font-size="12">{{Option Field}}</text>
  <rect x="654" y="189" width="180" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="662" y="205" fill="#323130" font-size="12.5">{{Option}}</text>
  <text x="820" y="205" fill="#605e5c" font-size="10">▾</text>

  <!-- Row 3 left: decimal (right-aligned) | right: boolean toggle -->
  <text x="30" y="236" fill="#605e5c" font-size="12">{{Amount Field}}</text>
  <rect x="190" y="221" width="140" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="322" y="237" fill="#323130" font-size="12.5" text-anchor="end">{{2,500.00}}</text>

  <text x="530" y="236" fill="#605e5c" font-size="12">{{Boolean Field}}</text>
  <rect x="654" y="224" width="36" height="16" rx="8" fill="#0078d4"/>
  <circle cx="682" cy="232" r="6" fill="#fff"/>

  <!-- Row 4 left: date field -->
  <text x="30" y="268" fill="#605e5c" font-size="12">{{Date Field}}</text>
  <rect x="190" y="253" width="140" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="198" y="269" fill="#323130" font-size="12.5">{{01/01/2026}}</text>

  <!-- ============ CALLOUT MARKERS (r=11, placed 14 px right of the field box) ============ -->
  <!-- 1 -->
  <circle cx="384" cy="168" r="11" fill="#d13438"/>
  <text x="384" y="172" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <!-- 2 -->
  <circle cx="848" cy="200" r="11" fill="#d13438"/>
  <text x="848" y="204" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- ============ NOTES SECTION (24 px pitch for each note) ============ -->
  <rect x="0" y="300" width="1060" height="120" fill="#faf9f8"/>
  <line x1="16" y1="300" x2="1044" y2="300" stroke="#d2d0ce" stroke-width="1"/>
  <text x="24" y="324" fill="#323130" font-size="13" font-weight="700">Notes</text>

  <!-- Note 1 -->
  <circle cx="32" cy="348" r="9" fill="#d13438"/>
  <text x="32" y="352" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="50" y="352" fill="#605e5c" font-size="11.5">{{Field}}: {{behavior or validation}} — {{REQ-n, US-n.n, EC-n.n}}</text>

  <!-- Note 2 -->
  <circle cx="32" cy="372" r="9" fill="#d13438"/>
  <text x="32" y="376" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="50" y="376" fill="#605e5c" font-size="11.5">{{Field}}: {{behavior or validation}} — {{REQ-n, US-n.n}}</text>
</svg>
