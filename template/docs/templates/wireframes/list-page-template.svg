<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- LIST PAGE WIREFRAME TEMPLATE. Copy to docs/wireframes/NN-<page-name>.svg and replace {{...}}.
       Rows are 34 px high. Add rows by copying a row block and adding 34 to each y value. -->
  <!-- Background -->
  <rect width="1060" height="400" fill="#fff"/>

  <!-- ============ BC HEADER BAR ============ -->
  <rect width="1060" height="40" fill="#1a3050"/>
  <text x="44" y="26" fill="#fff" font-size="14" font-weight="600">Dynamics 365 Business Central</text>
  <text x="780" y="26" fill="#6fa0c2" font-size="11">Environment: dev</text>
  <circle cx="940" cy="20" r="14" fill="#0078d4" opacity="0.9"/>
  <text x="933" y="24" fill="#fff" font-size="10" font-weight="700">PA</text>
  <text x="975" y="27" fill="#7d8c9c" font-size="17">⚙</text>
  <text x="1008" y="27" fill="#7d8c9c" font-size="17">?</text>

  <!-- ============ COMPANY BAR ============ -->
  <rect y="40" width="1060" height="36" fill="#fff"/>
  <line x1="0" y1="76" x2="1060" y2="76" stroke="#e1dfdd"/>
  <text x="20" y="64" fill="#323130" font-size="14" font-weight="700">CRONUS USA, Inc.</text>
  <text x="168" y="64" fill="#c8c6c4" font-size="14">|</text>
  <text x="186" y="64" fill="#0078d4" font-size="13">Finance ▾</text>
  <text x="256" y="64" fill="#0078d4" font-size="13">Cash Management ▾</text>
  <text x="400" y="64" fill="#0078d4" font-size="13">Sales ▾</text>
  <text x="450" y="64" fill="#0078d4" font-size="13">Purchasing ▾</text>

  <!-- ============ PAGE TITLE &amp; ACTION BAR ============ -->
  <rect y="76" width="1060" height="36" fill="#faf9f8"/>
  <line x1="0" y1="112" x2="1060" y2="112" stroke="#edebe9"/>
  <text x="20" y="100" fill="#323130" font-size="15" font-weight="600">{{List Caption}}:</text>
  <text x="173" y="100" fill="#0078d4" font-size="14">All ▾</text>
  <line x1="215" y1="82" x2="215" y2="108" stroke="#e1dfdd"/>
  <text x="228" y="100" fill="#605e5c" font-size="13">☰</text>
  <text x="250" y="100" fill="#a19f9d" font-size="13">⊞</text>
  <line x1="272" y1="82" x2="272" y2="108" stroke="#e1dfdd"/>
  <text x="284" y="100" fill="#605e5c" font-size="12">🔍</text>
  <line x1="308" y1="82" x2="308" y2="108" stroke="#e1dfdd"/>
  <text x="322" y="100" fill="#323130" font-size="13">+ New</text>
  <text x="378" y="100" fill="#323130" font-size="13">Delete</text>
  <text x="432" y="100" fill="#323130" font-size="13">Home ▾</text>
  <text x="497" y="100" fill="#323130" font-size="13" font-weight="600">{{Primary Action}}</text>
  <text x="660" y="100" fill="#323130" font-size="13">Process ▾</text>
  <text x="735" y="100" fill="#323130" font-size="13">Report ▾</text>
  <text x="960" y="100" fill="#605e5c" font-size="13">▼</text>
  <text x="985" y="100" fill="#605e5c" font-size="13">⊕</text>
  <text x="1010" y="100" fill="#605e5c" font-size="13">≡</text>

  <!-- ============ COLUMN HEADERS ============ -->
  <rect y="112" width="1060" height="30" fill="#faf9f8"/>
  <line x1="0" y1="142" x2="1060" y2="142" stroke="#edebe9"/>
  <text x="20" y="131" fill="#605e5c" font-size="11.5" font-weight="600">No.</text>
  <text x="105" y="131" fill="#605e5c" font-size="11.5" font-weight="600">{{Column 2}}</text>
  <text x="295" y="131" fill="#605e5c" font-size="11.5" font-weight="600">{{Column 3}}</text>
  <text x="415" y="131" fill="#605e5c" font-size="11.5" font-weight="600">Status</text>
  <text x="500" y="131" fill="#605e5c" font-size="11.5" font-weight="600">{{Date Column}}</text>
  <text x="810" y="131" fill="#605e5c" font-size="11.5" font-weight="600">{{Amount Column}}</text>

  <!-- ============ DATA ROWS ============ -->
  <!-- Row 1 (Selected) -->
  <rect y="142" width="1060" height="34" fill="#cce4f7"/>
  <text x="20" y="164" fill="#0078d4" font-size="12.5" text-decoration="underline">{{REC-0001}}</text>
  <text x="105" y="164" fill="#323130" font-size="12.5">Adatum Corporation</text>
  <text x="295" y="164" fill="#323130" font-size="12.5">{{Value}}</text>
  <text x="415" y="164" fill="#323130" font-size="12.5">Active</text>
  <text x="500" y="164" fill="#323130" font-size="12.5">01/01/2026</text>
  <text x="890" y="164" fill="#323130" font-size="12.5" text-anchor="end">5,000.00</text>

  <!-- Row 2 -->
  <rect y="176" width="1060" height="34" fill="#fff"/>
  <line x1="0" y1="176" x2="1060" y2="176" stroke="#f3f2f1"/>
  <text x="20" y="198" fill="#0078d4" font-size="12.5" text-decoration="underline">{{REC-0002}}</text>
  <text x="105" y="198" fill="#323130" font-size="12.5">Trey Research</text>
  <text x="295" y="198" fill="#323130" font-size="12.5">{{Value}}</text>
  <text x="415" y="198" fill="#323130" font-size="12.5">Draft</text>
  <text x="500" y="198" fill="#323130" font-size="12.5">03/01/2026</text>
  <text x="890" y="198" fill="#323130" font-size="12.5" text-anchor="end">2,500.00</text>

  <!-- Row 3 -->
  <rect y="210" width="1060" height="34" fill="#fff"/>
  <line x1="0" y1="210" x2="1060" y2="210" stroke="#f3f2f1"/>
  <text x="20" y="232" fill="#0078d4" font-size="12.5" text-decoration="underline">{{REC-0003}}</text>
  <text x="105" y="232" fill="#323130" font-size="12.5">School of Fine Art</text>
  <text x="295" y="232" fill="#323130" font-size="12.5">{{Value}}</text>
  <text x="415" y="232" fill="#323130" font-size="12.5">Expired</text>
  <text x="500" y="232" fill="#323130" font-size="12.5">01/01/2025</text>
  <text x="890" y="232" fill="#323130" font-size="12.5" text-anchor="end">1,200.00</text>
  <line x1="0" y1="244" x2="1060" y2="244" stroke="#f3f2f1"/>

  <!-- ============ CALLOUT MARKERS ============ -->
  <!-- 1: Primary action -->
  <circle cx="632" cy="94" r="11" fill="#d13438"/>
  <text x="632" y="98" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <!-- 2: Status column -->
  <circle cx="470" cy="127" r="11" fill="#d13438"/>
  <text x="470" y="131" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- ============ NOTES SECTION ============ -->
  <rect x="0" y="264" width="1060" height="136" fill="#faf9f8"/>
  <line x1="16" y1="264" x2="1044" y2="264" stroke="#d2d0ce" stroke-width="1"/>
  <text x="24" y="288" fill="#323130" font-size="13" font-weight="700">Notes</text>

  <!-- Note 1 -->
  <circle cx="32" cy="312" r="9" fill="#d13438"/>
  <text x="32" y="316" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="50" y="316" fill="#605e5c" font-size="11.5">{{Primary Action}}: {{what it does}} — {{US-n.n, R-n}}</text>

  <!-- Note 2 -->
  <circle cx="32" cy="336" r="9" fill="#d13438"/>
  <text x="32" y="340" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="50" y="340" fill="#605e5c" font-size="11.5">Status: filterable and sortable — {{REQ-n, US-n.n}}</text>
</svg>
