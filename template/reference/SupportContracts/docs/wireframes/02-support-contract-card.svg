  <rect x="654" y="341" width="140" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="746" y="357" fill="#323130" font-size="12.5" text-anchor="end">5,000.00</text>

  <!-- Row 2: Last Renewed Date -->
