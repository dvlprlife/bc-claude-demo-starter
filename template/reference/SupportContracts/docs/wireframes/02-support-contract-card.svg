  <text x="30" y="258" fill="#605e5c" font-size="12">End Date</text>
  <rect x="150" y="243" width="140" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="158" y="259" fill="#323130" font-size="12.5">12/31/2026</text>

  <text x="530" y="258" fill="#605e5c" font-size="12">External Document No.</text>
  <rect x="690" y="243" width="160" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="698" y="259" fill="#323130" font-size="12.5">PO-2026-0042</text>

