  <text x="158" y="169" fill="#0078d4" font-size="12.5">10000</text>

  <text x="530" y="168" fill="#605e5c" font-size="12">Status</text>
  <rect x="654" y="154" width="90" height="20" rx="10" fill="#107c10" opacity="0.12"/>
  <text x="672" y="169" fill="#107c10" font-size="12" font-weight="600">Active</text>

