  <text x="296" y="100" fill="#323130" font-size="13">Home ▾</text>
  <text x="358" y="100" fill="#323130" font-size="13" font-weight="600">Activate</text>
  <text x="426" y="100" fill="#323130" font-size="13">Cancel Contract</text>
