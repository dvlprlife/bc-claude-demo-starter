  <line x1="0" y1="458" x2="1060" y2="458" stroke="#edebe9"/>
  <text x="30" y="450" fill="#605e5c" font-size="11.5" font-weight="600">Contact No.</text>
  <text x="170" y="450" fill="#605e5c" font-size="11.5" font-weight="600">Name</text>
  <text x="400" y="450" fill="#605e5c" font-size="11.5" font-weight="600">Phone No.</text>
  <text x="580" y="450" fill="#605e5c" font-size="11.5" font-weight="600">E-Mail</text>

  <!-- Contact Row 1 (selected) -->
  <rect x="0" y="458" width="1060" height="30" fill="#cce4f7"/>
  <text x="30" y="478" fill="#0078d4" font-size="12.5" text-decoration="underline">CT000001</text>
  <text x="170" y="478" fill="#323130" font-size="12.5">Robert Townes</text>
  <text x="400" y="478" fill="#323130" font-size="12.5">(555) 100-0001</text>
  <text x="580" y="478" fill="#323130" font-size="12.5">robert@adatum.com</text>

  <!-- Contact Row 2 -->
  <rect x="0" y="488" width="1060" height="30" fill="#fff"/>
  <line x1="0" y1="488" x2="1060" y2="488" stroke="#f3f2f1"/>
  <text x="30" y="508" fill="#0078d4" font-size="12.5" text-decoration="underline">CT000002</text>
  <text x="170" y="508" fill="#323130" font-size="12.5">Sarah Parker</text>
  <text x="400" y="508" fill="#323130" font-size="12.5">(555) 100-0002</text>
  <text x="580" y="508" fill="#323130" font-size="12.5">sarah@adatum.com</text>

  <!-- Contact Row 3 -->
  <rect x="0" y="518" width="1060" height="30" fill="#fff"/>
  <line x1="0" y1="518" x2="1060" y2="518" stroke="#f3f2f1"/>
  <text x="30" y="538" fill="#0078d4" font-size="12.5" text-decoration="underline">CT000003</text>
  <text x="170" y="538" fill="#323130" font-size="12.5">James Wilson</text>
  <text x="400" y="538" fill="#323130" font-size="12.5">(555) 100-0003</text>
  <text x="580" y="538" fill="#323130" font-size="12.5">james@adatum.com</text>
  <line x1="0" y1="548" x2="1060" y2="548" stroke="#f3f2f1"/>

  <!-- ============ CALLOUT MARKERS ============ -->
  <!-- 1: Contract No. (page title) -->
  <circle cx="256" cy="87" r="11" fill="#d13438"/>
  <text x="256" y="91" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>

  <!-- 2: Customer No. field -->
  <circle cx="344" cy="159" r="11" fill="#d13438"/>
  <text x="344" y="163" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- 3: Service Level field -->
  <circle cx="850" cy="189" r="11" fill="#d13438"/>
  <text x="850" y="193" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>

  <!-- 4: Actions (Activate / Cancel / Renew) -->
  <circle cx="660" cy="87" r="11" fill="#d13438"/>
  <text x="660" y="91" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>

  <!-- 5: Start/End Date fields -->
  <circle cx="304" cy="219" r="11" fill="#d13438"/>
  <text x="304" y="223" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">5</text>

  <!-- 6: Auto-Renew toggle -->
  <circle cx="690" cy="219" r="11" fill="#d13438"/>
  <text x="690" y="223" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">6</text>

  <!-- 7: Renewal section -->
  <circle cx="120" cy="317" r="11" fill="#d13438"/>
  <text x="120" y="321" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">7</text>

  <!-- 8: External Document No. -->
  <circle cx="864" cy="249" r="11" fill="#d13438"/>
  <text x="864" y="253" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">8</text>

  <!-- 9: Contacts subpage -->
  <circle cx="144" cy="417" r="11" fill="#d13438"/>
  <text x="144" y="421" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">9</text>

  <!-- ============ NOTES SECTION ============ -->
  <rect x="0" y="566" width="1060" height="264" fill="#faf9f8"/>
  <line x1="16" y1="566" x2="1044" y2="566" stroke="#d2d0ce" stroke-width="1"/>
  <text x="24" y="590" fill="#323130" font-size="13" font-weight="700">Notes</text>

  <!-- Note 1 -->
  <circle cx="32" cy="614" r="9" fill="#d13438"/>
  <text x="32" y="618" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="50" y="618" fill="#605e5c" font-size="11.5">Contract No. auto-assigned from configured number series — REQ-7, US-1.1</text>

  <!-- Note 2 -->
  <circle cx="32" cy="636" r="9" fill="#d13438"/>
  <text x="32" y="640" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="50" y="640" fill="#605e5c" font-size="11.5">Customer No. validated against BC Customer table; name auto-populates (read-only) — REQ-3, US-2.1</text>

  <!-- Note 3 -->
  <circle cx="32" cy="658" r="9" fill="#d13438"/>
  <text x="32" y="662" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">3</text>
  <text x="50" y="662" fill="#605e5c" font-size="11.5">Service Level dropdown: Standard, Expedited, Full Service — REQ-2, US-3.1</text>

  <!-- Note 4 -->
  <circle cx="32" cy="680" r="9" fill="#d13438"/>
  <text x="32" y="684" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">4</text>
  <text x="50" y="684" fill="#605e5c" font-size="11.5">Action bar: Activate, Cancel Contract, Renew Contract — status-driven availability — REQ-6, US-5.1, US-5.2, US-6.1</text>

  <!-- Note 5 -->
  <circle cx="32" cy="702" r="9" fill="#d13438"/>
  <text x="32" y="706" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">5</text>
  <text x="50" y="706" fill="#605e5c" font-size="11.5">Start Date must be ≤ End Date; flexible duration (not enforced to 12 months) — REQ-5</text>

  <!-- Note 6 -->
  <circle cx="32" cy="724" r="9" fill="#d13438"/>
  <text x="32" y="728" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">6</text>
  <text x="50" y="728" fill="#605e5c" font-size="11.5">Auto-Renew toggle controls renewal eligibility; editable in Draft and Active status — REQ-8</text>

  <!-- Note 7 -->
  <circle cx="32" cy="746" r="9" fill="#d13438"/>
  <text x="32" y="750" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">7</text>
  <text x="50" y="750" fill="#605e5c" font-size="11.5">Per-contract Renewal Item No. and Renewal Amount override setup defaults — R-1, US-2.2</text>

  <!-- Note 8 -->
  <circle cx="32" cy="768" r="9" fill="#d13438"/>
  <text x="32" y="772" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">8</text>
  <text x="50" y="772" fill="#605e5c" font-size="11.5">External Document No. carried to renewal invoice header — R-8, US-2.3</text>

  <!-- Note 9 -->
  <circle cx="32" cy="790" r="9" fill="#d13438"/>
  <text x="32" y="794" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">9</text>
  <text x="50" y="794" fill="#605e5c" font-size="11.5">Contacts subpage: max 3 contacts per contract, filtered to customer's contacts — REQ-4, US-4.1</text>
</svg>
