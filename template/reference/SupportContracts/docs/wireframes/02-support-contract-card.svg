  <rect x="150" y="273" width="500" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="158" y="289" fill="#323130" font-size="12.5">Annual full-service support contract for Adatum Corporation</text>

