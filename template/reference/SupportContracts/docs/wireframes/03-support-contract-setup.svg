<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1060" height="410" fill="#fff"/>

  <!-- ============ BC HEADER BAR ============ -->
  <rect width="1060" height="40" fill="#1a3050"/>
  <text x="44" y="26" fill="#fff" font-size="14" font-weight="600">Dynamics 365 Business Central</text>
  <text x="780" y="26" fill="#6fa0c2" font-size="11">Environment: dev</text>
  <circle cx="940" cy="20" r="14" fill="#0078d4" opacity="0.9"/>
  <text x="933" y="24" fill="#fff" font-size="10" font-weight="700">PA</text>
  <text x="975" y="27" fill="#7d8c9c" font-size="17">⚙</text>
  <text x="1008" y="27" fill="#7d8c9c" font-size="17">?</text>

  <!-- ============ COMPANY BAR ============ -->
  <rect y="40" width="1060" height="36" fill="#fff"/>
  <line x1="0" y1="76" x2="1060" y2="76" stroke="#e1dfdd"/>
  <text x="20" y="64" fill="#323130" font-size="14" font-weight="700">CRONUS USA, Inc.</text>
  <text x="168" y="64" fill="#c8c6c4" font-size="14">|</text>
  <text x="186" y="64" fill="#0078d4" font-size="13">Finance ▾</text>
  <text x="256" y="64" fill="#0078d4" font-size="13">Cash Management ▾</text>
  <text x="400" y="64" fill="#0078d4" font-size="13">Sales ▾</text>
  <text x="450" y="64" fill="#0078d4" font-size="13">Purchasing ▾</text>

  <!-- ============ PAGE TITLE &amp; ACTION BAR ============ -->
  <rect y="76" width="1060" height="36" fill="#faf9f8"/>
  <line x1="0" y1="112" x2="1060" y2="112" stroke="#edebe9"/>
  <text x="20" y="100" fill="#323130" font-size="15" font-weight="600">Support Contract Setup</text>

  <!-- ============ FASTTAB: GENERAL ============ -->
  <rect x="0" y="116" width="1060" height="28" fill="#f3f2f1"/>
  <line x1="0" y1="144" x2="1060" y2="144" stroke="#edebe9"/>
  <text x="20" y="135" fill="#323130" font-size="13" font-weight="600">▾  General</text>

  <!-- Row 1: Contract No. Series -->
  <text x="30" y="172" fill="#605e5c" font-size="12">Contract No. Series</text>
  <rect x="190" y="157" width="180" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="198" y="173" fill="#0078d4" font-size="12.5">SC-CON</text>

  <!-- Row 2: Renewal Item No. -->
  <text x="30" y="204" fill="#605e5c" font-size="12">Renewal Item No.</text>
  <rect x="190" y="189" width="180" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="198" y="205" fill="#0078d4" font-size="12.5">SVC-RENEWAL</text>

  <!-- Row 3: Default Renewal Amount -->
  <text x="30" y="236" fill="#605e5c" font-size="12">Default Renewal Amount</text>
  <rect x="210" y="221" width="140" height="22" rx="3" fill="#fff" stroke="#c8c6c4" stroke-width="0.7"/>
  <text x="302" y="237" fill="#323130" font-size="12.5" text-anchor="end">2,500.00</text>

  <!-- ============ CALLOUT MARKERS ============ -->
  <!-- 1: Contract No. Series -->
  <circle cx="384" cy="163" r="11" fill="#d13438"/>
  <text x="384" y="167" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>

  <!-- 2: Renewal Item No. -->
  <circle cx="384" cy="195" r="11" fill="#d13438"/>
  <text x="384" y="199" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- 3: Default Renewal Amount -->
  <circle cx="364" cy="227" r="11" fill="#d13438"/>
  <text x="364" y="231" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>

  <!-- ============ NOTES SECTION ============ -->
  <rect x="0" y="268" width="1060" height="142" fill="#faf9f8"/>
  <line x1="16" y1="268" x2="1044" y2="268" stroke="#d2d0ce" stroke-width="1"/>
  <text x="24" y="292" fill="#323130" font-size="13" font-weight="700">Notes</text>

  <!-- Note 1 -->
  <circle cx="32" cy="316" r="9" fill="#d13438"/>
  <text x="32" y="320" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="50" y="320" fill="#605e5c" font-size="11.5">Contract No. Series: lookup to BC No. Series table; required before contracts can be created — REQ-7, REQ-10, US-1.1</text>

  <!-- Note 2 -->
  <circle cx="32" cy="340" r="9" fill="#d13438"/>
  <text x="32" y="344" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="50" y="344" fill="#605e5c" font-size="11.5">Renewal Item No.: lookup to Item table; only non-blocked items accepted — REQ-10, US-1.1, EC-1.1</text>

  <!-- Note 3 -->
  <circle cx="32" cy="364" r="9" fill="#d13438"/>
  <text x="32" y="368" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">3</text>
  <text x="50" y="368" fill="#605e5c" font-size="11.5">Default Renewal Amount: used when contract-specific amount is blank; zero is permitted — REQ-10, US-1.1, EC-1.3</text>
</svg>
